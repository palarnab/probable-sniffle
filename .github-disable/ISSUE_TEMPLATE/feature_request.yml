name: Feature request
description: Suggest an idea or improvement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: "Thanks for the suggestion. Ideas grounded in real imaging workflows are especially welcome."

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Viewer / UI
        - 3D volume rendering
        - Model / inference
        - Explainability (Grad-CAM)
        - DICOM parsing & metadata
        - Interoperability (DICOM SR, FHIR, DICOMweb)
        - Worklist & persistence
        - Deployment & DevOps
        - Documentation
        - Other
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the workflow gap or pain point. Clinical or technical context helps a lot.
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered

  - type: checkboxes
    id: contribute
    attributes:
      label: Contribution
      options:
        - label: I'd be willing to work on this.
